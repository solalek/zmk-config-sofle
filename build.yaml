# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
# This file generates the GitHub Actions matrix.
# ... (комментарии в начале файла можно оставить) ...
---
include:
  # -----------------------------------------
  # 1. Прошивка для донгла (Центральное устройство)
  # -----------------------------------------
  # - board: nrf52840dongle_nrf52840
  #   shield: sofle_dongle
# 1. Прошивка для донгла (Центральное устройство)
  - board: nrf52840dongle_nrf52840
    shield: sofle_dongle
    cmake-args: -DCONFIG_BUILD_OUTPUT_BIN=n -DCONFIG_BUILD_OUTPUT_HEX=y

  # ... (здесь идут sofle_left и sofle_right без изменений) ...

  # 3. Файлы для сброса настроек (Settings Reset)
  - board: nrf52840dongle_nrf52840
    shield: settings_reset
    cmake-args: -DCONFIG_BUILD_OUTPUT_BIN=n -DCONFIG_BUILD_OUTPUT_HEX=y

  # -----------------------------------------
  # 2. Основная клавиатура (Периферия)
  # Добавляем cmake-args, чтобы превратить половинки в периферийные
  # -----------------------------------------
  - board: nice_nano_v2
    shield: sofle_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  - board: nice_nano_v2
    shield: sofle_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  # -----------------------------------------
  # 3. Файлы для сброса настроек (Settings Reset)
  # Нам нужны файлы сброса для обоих типов плат!
  # -----------------------------------------
  # - board: nrf52840dongle_nrf52840
  #   shield: settings_reset

  - board: nice_nano_v2
    shield: settings_reset

